{% extends "base.html" %}

{% block title %}
Edit Company
{% endblock %}

{% block content %}

<div class="container mt-4">

<div class="row justify-content-center">

<div class="col-lg-7">

<div class="card shadow border-0 rounded-4">

<div class="card-body">

<h2 class="text-primary mb-4">

<i class="bi bi-pencil-square"></i>

Edit Company

</h2>

<form method="POST">

<div class="mb-3">

<label>Company Name</label>

<input
type="text"
class="form-control"
name="company_name"
value="{{ company.company_name }}"
required>

</div>

<div class="mb-3">

<label>Role</label>

<input
type="text"
class="form-control"
name="role"
value="{{ company.role }}"
required>

</div>

<div class="mb-3">

<label>Package</label>

<input
type="text"
class="form-control"
name="package"
value="{{ company.package }}"
required>

</div>

<div class="mb-3">

<label>Location</label>

<input
type="text"
class="form-control"
name="location"
value="{{ company.location }}">

</div>

<div class="mb-3">

<label>Eligible Department</label>

<input
type="text"
class="form-control"
name="eligible_department"
value="{{ company.eligible_department }}">

</div>

<div class="mb-3">

<label>Minimum CGPA</label>

<input
type="number"
step="0.01"
min="0"
max="10"
class="form-control"
name="minimum_cgpa"
value="{{ company.minimum_cgpa }}"
required>

</div>

<div class="mb-4">

<label>Last Date</label>

<input
type="date"
class="form-control"
name="last_date"
value="{{ company.last_date }}"
required>

</div>

<button class="btn btn-primary">

<i class="bi bi-save"></i>

Update Company

</button>

<a href="/admin/companies"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
