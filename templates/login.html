{% extends "base.html" %}

{% block title %}
Login | PlacementHub
{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center align-items-center vh-100">

        <div class="col-md-5">

            <div class="card shadow-lg border-0 p-4">

                <!-- Logo -->
                <div class="text-center">

                    <i class="bi bi-mortarboard-fill text-primary display-3"></i>

                    <h2 class="mt-2 text-primary fw-bold">
                        PlacementHub
                    </h2>

                    <p class="text-muted">
                        Welcome Back! Login to continue your placement journey.
                    </p>

                </div>

                <form method="POST" action="/login">

                    <!-- Email -->

                    <div class="mb-3">

                        <label class="form-label">
                            Email Address
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-envelope-fill"></i>
                            </span>

                            <input
                                type="email"
                                class="form-control"
                                name="email"
                                placeholder="Enter Email"
                                required>

                        </div>

                    </div>

                    <!-- Password -->

                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-lock-fill"></i>
                            </span>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                required>

                            <button
                                class="btn btn-secondary"
                                type="button"
                                onclick="togglePassword()">

                                <i id="eyeIcon" class="bi bi-eye-fill"></i>

                            </button>

                        </div>

                    </div>

                    <div class="text-end mb-3">

                        <a href="#" class="text-decoration-none">
                            Forgot Password?
                        </a>

                    </div>

                    <button class="btn btn-primary w-100">

                        <i class="bi bi-box-arrow-in-right"></i>

                        Login

                    </button>

                </form>

                <hr>

                <p class="text-center">

                    Don't have an account?

                    <a href="/register" class="fw-bold text-decoration-none">
                        Register
                    </a>

                </p>

            </div>

           

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- Show Password Script -->
<script>
function togglePassword() {

    const password = document.getElementById("password");
    const eyeIcon = document.getElementById("eyeIcon");

    if (password.type === "password") {

        password.type = "text";
        eyeIcon.classList.remove("bi-eye-fill");
        eyeIcon.classList.add("bi-eye-slash-fill");

    } else {

        password.type = "password";
        eyeIcon.classList.remove("bi-eye-slash-fill");
        eyeIcon.classList.add("bi-eye-fill");

    }
}
</script>

{% endblock %}
