{% extends "base.html" %}

{% block title %}
Edit Student | PlacementHub
{% endblock %}

{% block content %}

<div class="container">
<div class="row justify-content-center">
<div class="col-md-7">

<div class="card shadow-lg p-4 mt-5">

    <div class="text-center">

        <i class="bi bi-person-gear text-primary display-3"></i>

        <h2 class="text-primary fw-bold">
            Edit Student
        </h2>

        <p class="text-muted">
            Update student information
        </p>

    </div>


    <form method="POST">

        <div class="row">

            <!-- Full Name -->

            <div class="col-md-6 mb-3">

                <label class="form-label">
                    Full Name
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="full_name"
                    name="full_name"
                    value="{{ student.full_name }}"
                    placeholder="Enter Full Name"
                    required
                >

                <small
                    id="nameError"
                    class="text-danger">
                </small>

            </div>


            <!-- Register Number -->

            <div class="col-md-6 mb-3">

                <label class="form-label">
                    Register Number
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="register_number"
                    name="register_number"
                    value="{{ student.register_number }}"
                    placeholder="Ex: 251AT014 or 24UGCCA00128"
                    required
                >

                <small
                    id="registerError"
                    class="text-danger">
                </small>

            </div>


            <!-- Email -->

            <div class="col-md-6 mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    value="{{ student.email }}"
                    placeholder="Enter Email Address"
                    required
                >

                <small
                    id="emailError"
                    class="text-danger">
                </small>

            </div>


            <!-- Phone -->

            <div class="col-md-6 mb-3">

                <label class="form-label">
                    Phone Number
                </label>

                <input
                    type="tel"
                    class="form-control"
                    id="phone"
                    name="phone"
                    value="{{ student.phone }}"
                    placeholder="Enter 10-digit Mobile Number"
                    maxlength="10"
                    inputmode="numeric"
                    required
                >

                <small
                    id="phoneError"
                    class="text-danger">
                </small>

            </div>


            <!-- Department -->

            <div class="col-md-6 mb-3">

                <label class="form-label">
                    Department
                </label>

                <select
                    class="form-select"
                    name="department"
                    required>

                    <option value="">
                        Select Department
                    </option>

                    {% set departments = [
                        "BCA",
                        "B.Sc Computer Science",
                        "B.Sc Computer Science with Cognitive Systems",
                        "B.Sc Information Technology",
                        "B.Sc Artificial Intelligence & Machine Learning",
                        "B.Sc Data Science",
                        "B.Com",
                        "B.Com Computer Applications",
                        "B.Com Professional Accounting",
                        "B.Com Banking & Insurance",
                        "BBA",
                        "BBA Computer Applications",
                        "BA English",
                        "BA Tamil",
                        "BA Economics",
                        "B.Sc Mathematics",
                        "B.Sc Physics",
                        "B.Sc Chemistry",
                        "B.Sc Biotechnology",
                        "B.Sc Psychology",
                        "B.Sc Visual Communication"
                    ] %}

                    {% for department in departments %}

                    <option
                        value="{{ department }}"
                        {% if student.department == department %}
                        selected
                        {% endif %}
                    >
                        {{ department }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <!-- Year -->

            <div class="col-md-6 mb-3">

                <label class="form-label">
                    Year of Study
                </label>

                <select
                    class="form-select"
                    name="year"
                    required>

                    <option value="">
                        Select Year
                    </option>

                    <option
                        value="1"
                        {% if student.year|string == "1" %}
                        selected
                        {% endif %}
                    >
                        First Year
                    </option>

                    <option
                        value="2"
                        {% if student.year|string == "2" %}
                        selected
                        {% endif %}
                    >
                        Second Year
                    </option>

                    <option
                        value="3"
                        {% if student.year|string == "3" %}
                        selected
                        {% endif %}
                    >
                        Third Year
                    </option>

                </select>

            </div>


            <!-- CGPA -->

            <div class="col-md-6 mb-3">

                <label class="form-label">
                    CGPA
                </label>

                <input
                    type="number"
                    class="form-control"
                    id="cgpa"
                    name="cgpa"
                    value="{{ student.cgpa }}"
                    min="0"
                    max="10"
                    step="0.01"
                    placeholder="Enter CGPA"
                    required
                >

                <small
                    id="cgpaError"
                    class="text-danger">
                </small>

            </div>


            <!-- Buttons -->

            <div class="col-md-12 mt-3">

                <button
                    type="submit"
                    class="btn btn-primary w-100 mb-2">

                    <i class="bi bi-check-circle-fill"></i>

                    Update Student

                </button>

                <a
                    href="{{ url_for('admin_students') }}"
                    class="btn btn-secondary w-100">

                    <i class="bi bi-arrow-left"></i>

                    Cancel

                </a>

            </div>

        </div>

    </form>

</div>

</div>
</div>
</div>


<!-- Same validation used in Register page -->

<script src="{{ url_for('static', filename='js/validation.js') }}"></script>

{% endblock %}
