{% extends "base.html" %}

{% block title %}
Add Company
{% endblock %}

{% block content %}

<div class="container mt-4">

<div class="row justify-content-center">

<div class="col-lg-7">

<div class="card shadow border-0 rounded-4">

<div class="card-body p-4">

<h2 class="text-primary mb-4">

<i class="bi bi-building-add"></i>

Add Company

</h2>

<form method="POST" enctype="multipart/form-data">

<div class="mb-3">

<label class="form-label">

Company Name

</label>

<input
type="text"
class="form-control"
name="company_name"
required>

</div>

<div class="mb-3">

<label class="form-label">

Role

</label>

<input
type="text"
class="form-control"
name="role"
required>

</div>

<div class="mb-3">

<label class="form-label">

Package

</label>

<input
type="text"
class="form-control"
name="package"
placeholder="Example: 4.5 LPA"
required>

</div>

<div class="mb-3">

<label class="form-label">

Location

</label>

<input
type="text"
class="form-control"
name="location">

</div>

<div class="mb-3">

    <label class="form-label">

        Eligible Departments

    </label>

    <select
        class="selectpicker"
        name="eligible_department"
        multiple
        data-live-search="true"
        data-actions-box="true"
        title="Select Eligible Departments">

        <option value="BCA">BCA</option>

        <option value="B.Sc Computer Science">
            B.Sc Computer Science
        </option>

        <option value="B.Sc Computer Science with Cognitive Systems">
            B.Sc Computer Science with Cognitive Systems
        </option>

        <option value="B.Sc Information Technology">
            B.Sc Information Technology
        </option>

        <option value="B.Sc Artificial Intelligence & Machine Learning">
            B.Sc Artificial Intelligence & Machine Learning
        </option>

        <option value="B.Sc Data Science">
            B.Sc Data Science
        </option>

        <option value="B.Com">
            B.Com
        </option>

        <option value="B.Com Computer Applications">
            B.Com Computer Applications
        </option>

        <option value="B.Com Professional Accounting">
            B.Com Professional Accounting
        </option>

        <option value="BBA">
            BBA
        </option>

        <option value="BA English">
            BA English
        </option>

        <option value="BA Tamil">
            BA Tamil
        </option>

    </select>

</div>
<div class="mb-3">

<label class="form-label">

Minimum CGPA

</label>

<input
type="number"
step="0.01"
min="0"
max="10"
class="form-control"
name="minimum_cgpa"
required>

</div>

<div class="mb-4">

<label class="form-label">

Last Date

</label>

<input
type="date"
class="form-control"
name="last_date"
required>

</div>

<div class="mb-3">

<label class="form-label">

Company Logo

</label>

<input
type="file"
class="form-control"
name="logo"
accept=".png,.jpg,.jpeg">

</div>


<button class="btn btn-success w-100">

<i class="bi bi-check-circle-fill"></i>

Save Company

</button>

</form>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
